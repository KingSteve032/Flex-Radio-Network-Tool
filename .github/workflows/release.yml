name: Build And Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
          - runner: windows-latest
            goos: windows
            goarch: amd64
            ext: ".exe"
          - runner: macos-13
            goos: darwin
            goarch: amd64
            ext: ""
          - runner: macos-14
            goos: darwin
            goarch: arm64
            ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Linux build deps
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev

      - name: Build binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $name = "frnt-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          $commit = "${{ github.sha }}"
          if ($commit.Length -gt 12) { $commit = $commit.Substring(0, 12) }
          $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "dev" }

          $ldflags = @(
            "-X github.com/KingSteve032/Flex-Radio-Network-Tool/internal/buildinfo.Version=$version"
            "-X github.com/KingSteve032/Flex-Radio-Network-Tool/internal/buildinfo.Commit=$commit"
            "-X github.com/KingSteve032/Flex-Radio-Network-Tool/internal/buildinfo.BuildDate=$date"
          ) -join " "

          $env:GOOS = "${{ matrix.goos }}"
          $env:GOARCH = "${{ matrix.goarch }}"
          go build -trimpath -ldflags $ldflags -o ("dist/" + $name) .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frnt-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/frnt-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*
          generate_release_notes: true
