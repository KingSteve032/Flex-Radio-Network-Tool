name: Build And Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-native:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            arch_label: amd64
            ext: ""
          - runner: windows-latest
            goos: windows
            goarch: amd64
            arch_label: amd64
            ext: ".exe"
          - runner: macos-latest
            goos: darwin
            goarch: amd64
            arch_label: amd64
            ext: ""
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            arch_label: arm64
            ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Linux build deps
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev

      - name: Build binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $name = "frnt-${{ matrix.goos }}-${{ matrix.arch_label }}${{ matrix.ext }}"
          $commit = "${{ github.sha }}"
          if ($commit.Length -gt 12) { $commit = $commit.Substring(0, 12) }
          $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "dev" }

          $ldflags = @(
            "-X github.com/KingSteve032/Flex-Radio-Network-Tool/internal/buildinfo.Version=$version"
            "-X github.com/KingSteve032/Flex-Radio-Network-Tool/internal/buildinfo.Commit=$commit"
            "-X github.com/KingSteve032/Flex-Radio-Network-Tool/internal/buildinfo.BuildDate=$date"
          ) -join " "

          $env:GOOS = "${{ matrix.goos }}"
          $env:GOARCH = "${{ matrix.goarch }}"
          go build -trimpath -ldflags $ldflags -o ("dist/" + $name) .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frnt-${{ matrix.goos }}-${{ matrix.arch_label }}
          path: dist/frnt-${{ matrix.goos }}-${{ matrix.arch_label }}${{ matrix.ext }}
          if-no-files-found: error

  build-linux-arm:
    name: Build linux-${{ matrix.arch_label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            goarch: arm64
            arch_label: arm64
          - arch: armv7
            goarch: arm
            goarm: "7"
            arch_label: armv7
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build ARM binary in emulated target image
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: ${{ matrix.arch }}
          distro: ubuntu22.04
          githubToken: ${{ github.token }}
          install: |
            apt-get update -y
            apt-get install -y build-essential libpcap-dev ca-certificates curl
          run: |
            set -euo pipefail
            mkdir -p dist

            case "$(uname -m)" in
              aarch64)
                GO_TGZ="go1.25.2.linux-arm64.tar.gz"
                ;;
              armv7l|armv6l)
                GO_TGZ="go1.25.2.linux-armv6l.tar.gz"
                ;;
              *)
                echo "Unsupported ARM runtime architecture: $(uname -m)" >&2
                exit 1
                ;;
            esac

            curl -fsSL -o /tmp/go.tgz "https://go.dev/dl/${GO_TGZ}"
            rm -rf /usr/local/go
            tar -C /usr/local -xzf /tmp/go.tgz
            export PATH="/usr/local/go/bin:${PATH}"
            go version

            BUILD_VERSION="${GITHUB_REF_NAME:-dev}"
            COMMIT="$(printf '%s' "${GITHUB_SHA}" | cut -c1-12)"
            DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            LDFLAGS="-X github.com/KingSteve032/Flex-Radio-Network-Tool/internal/buildinfo.Version=${BUILD_VERSION} -X github.com/KingSteve032/Flex-Radio-Network-Tool/internal/buildinfo.Commit=${COMMIT} -X github.com/KingSteve032/Flex-Radio-Network-Tool/internal/buildinfo.BuildDate=${DATE}"

            export GOOS=linux
            export GOARCH="${{ matrix.goarch }}"
            if [ "${{ matrix.goarch }}" = "arm" ]; then
              export GOARM="${{ matrix.goarm }}"
            fi

            go build -trimpath -ldflags "${LDFLAGS}" -o "dist/frnt-linux-${{ matrix.arch_label }}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frnt-linux-${{ matrix.arch_label }}
          path: dist/frnt-linux-${{ matrix.arch_label }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build-native, build-linux-arm]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*
          generate_release_notes: true
