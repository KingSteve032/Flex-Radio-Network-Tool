name: Build And Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-native:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            arch_label: amd64
            ext: ""
          - runner: windows-latest
            goos: windows
            goarch: amd64
            arch_label: amd64
            ext: ".exe"
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            arch_label: amd64
            ext: ""
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            arch_label: arm64
            ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Linux build deps
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev

      - name: Build binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $name = "frnt-${{ matrix.goos }}-${{ matrix.arch_label }}${{ matrix.ext }}"
          $commit = "${{ github.sha }}"
          if ($commit.Length -gt 12) { $commit = $commit.Substring(0, 12) }
          $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "dev" }

          $ldflags = @(
            "-X github.com/KingSteve032/Flex-Radio-Network-Tool/internal/buildinfo.Version=$version"
            "-X github.com/KingSteve032/Flex-Radio-Network-Tool/internal/buildinfo.Commit=$commit"
            "-X github.com/KingSteve032/Flex-Radio-Network-Tool/internal/buildinfo.BuildDate=$date"
          ) -join " "
          if ("${{ matrix.goos }}" -eq "windows") {
            $ldflags += " -H=windowsgui"
          }

          $env:GOOS = "${{ matrix.goos }}"
          $env:GOARCH = "${{ matrix.goarch }}"
          go build -trimpath -ldflags $ldflags -o ("dist/" + $name) .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frnt-${{ matrix.goos }}-${{ matrix.arch_label }}
          path: dist/frnt-${{ matrix.goos }}-${{ matrix.arch_label }}${{ matrix.ext }}
          if-no-files-found: error

  build-linux-arm:
    name: Build linux-${{ matrix.arch_label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            goarch: arm64
            arch_label: arm64
          - arch: armv7
            goarch: arm
            goarm: "7"
            arch_label: armv7
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build ARM binary in emulated target image
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: ${{ matrix.arch }}
          distro: ubuntu22.04
          githubToken: ${{ github.token }}
          install: |
            apt-get update -y
            apt-get install -y build-essential clang libpcap-dev ca-certificates curl
          run: |
            set -euo pipefail
            mkdir -p dist

            case "$(uname -m)" in
              aarch64)
                GO_TGZ="go1.25.2.linux-arm64.tar.gz"
                ;;
              armv7l|armv6l)
                GO_TGZ="go1.25.2.linux-armv6l.tar.gz"
                ;;
              *)
                echo "Unsupported ARM runtime architecture: $(uname -m)" >&2
                exit 1
                ;;
            esac

            curl -fsSL -o /tmp/go.tgz "https://go.dev/dl/${GO_TGZ}"
            rm -rf /usr/local/go
            tar -C /usr/local -xzf /tmp/go.tgz
            export PATH="/usr/local/go/bin:${PATH}"
            go version

            BUILD_VERSION="${GITHUB_REF_NAME:-dev}"
            COMMIT="$(printf '%s' "${GITHUB_SHA}" | cut -c1-12)"
            DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            LDFLAGS="-X github.com/KingSteve032/Flex-Radio-Network-Tool/internal/buildinfo.Version=${BUILD_VERSION} -X github.com/KingSteve032/Flex-Radio-Network-Tool/internal/buildinfo.Commit=${COMMIT} -X github.com/KingSteve032/Flex-Radio-Network-Tool/internal/buildinfo.BuildDate=${DATE}"

            export GOOS=linux
            export GOARCH="${{ matrix.goarch }}"
            if [ "${{ matrix.goarch }}" = "arm" ]; then
              export GOARM="${{ matrix.goarm }}"
            fi
            # Avoid GCC ICEs seen under QEMU emulation for CGO deps (sqlite/pcap).
            export CC=clang
            export CXX=clang++
            export CGO_CFLAGS="-O1"
            export CGO_CXXFLAGS="-O1"
            export GOFLAGS="-p=1"

            go build -trimpath -ldflags "${LDFLAGS}" -o "dist/frnt-linux-${{ matrix.arch_label }}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frnt-linux-${{ matrix.arch_label }}
          path: dist/frnt-linux-${{ matrix.arch_label }}
          if-no-files-found: error

  package-windows-installer:
    name: Build Windows Installer
    runs-on: windows-latest
    needs: [build-native]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download windows binary
        uses: actions/download-artifact@v4
        with:
          name: frnt-windows-amd64
          path: dist/raw

      - name: Install packaging tools
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          choco install imagemagick.tool -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $src = Get-ChildItem -Path dist/raw -Recurse -File | Where-Object { $_.Name -eq "frnt-windows-amd64.exe" } | Select-Object -First 1
          if (-not $src) { throw "Could not find frnt-windows-amd64.exe in downloaded artifacts" }
          Copy-Item $src.FullName dist/frnt-windows-amd64.exe -Force
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "dev" }
          ./scripts/build-windows-installer.ps1 -Version $version -InputExe "dist/frnt-windows-amd64.exe" -OutputDir "dist/installer"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: frnt-windows-amd64-installer
          path: dist/installer/*.exe
          if-no-files-found: error

  package-macos-installer:
    name: Build macOS Installer
    runs-on: macos-latest
    needs: [build-native]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download darwin amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: frnt-darwin-amd64
          path: dist/raw/amd64

      - name: Download darwin arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: frnt-darwin-arm64
          path: dist/raw/arm64

      - name: Build universal binary and package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          AMD64_BIN="$(find dist/raw/amd64 -type f -name 'frnt-darwin-amd64' | head -n 1)"
          ARM64_BIN="$(find dist/raw/arm64 -type f -name 'frnt-darwin-arm64' | head -n 1)"
          if [[ -z "${AMD64_BIN}" || -z "${ARM64_BIN}" ]]; then
            echo "Missing darwin binaries for packaging" >&2
            exit 1
          fi
          lipo -create -output dist/frnt-darwin-universal "${AMD64_BIN}" "${ARM64_BIN}"
          chmod +x dist/frnt-darwin-universal
          VERSION="${GITHUB_REF_NAME:-dev}"
          bash scripts/build-macos-installer.sh "${VERSION}" dist/frnt-darwin-universal dist/installer

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: frnt-macos-universal-installer
          path: dist/installer/*.pkg
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build-native, build-linux-arm, package-windows-installer, package-macos-installer]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Generate checksums
        run: |
          set -euo pipefail
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > dist/SHA256SUMS.txt

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*
            dist/SHA256SUMS.txt
          generate_release_notes: true
