name: Build FRNT OpenWrt Client

on:
  push:
    branches:
      - main
    paths:
      - "openwrt-client/**"
      - ".github/workflows/openwrt-client.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frnt-openwrt-client-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ipk:
    name: Test and publish router + LuCI packages
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: openwrt-client/go.mod
          cache-dependency-path: openwrt-client/go.mod

      - name: Validate scripts and LuCI source
        run: |
          set -euo pipefail
          bash -n openwrt-client/build-ipk.sh
          sh -n openwrt-client/openwrt/etc/init.d/frnt-client
          sh -n openwrt-client/openwrt/usr/libexec/frnt-client-query
          sh -n openwrt-client/openwrt/usr/libexec/frnt-client-control
          node --check openwrt-client/luci/www/luci-static/resources/view/frnt/client.js
          python3 -m json.tool openwrt-client/luci/usr/share/rpcd/acl.d/luci-app-frnt-client.json > /dev/null
          python3 -m json.tool openwrt-client/luci/usr/share/luci/menu.d/luci-app-frnt-client.json > /dev/null

      - name: Test FRNT client
        working-directory: openwrt-client
        run: |
          go vet -mod=mod ./...
          go test -mod=mod -v ./...

      - name: Build OpenWrt ARM64 and LuCI IPKs
        run: bash openwrt-client/build-ipk.sh

      - name: Validate OpenWrt tar-gzip packages and write checksums
        shell: bash
        run: |
          set -euo pipefail
          cd openwrt-client/dist
          base=frnt-openwrt-client_0.1.2_aarch64_cortex-a53_neon-vfpv4.ipk
          luci=luci-app-frnt-client_0.1.2_all.ipk
          for package in "$base" "$luci"; do
            test -s "$package"
            tar -tzf "$package" | grep -Fx './debian-binary'
            tar -tzf "$package" | grep -Fx './control.tar.gz'
            tar -tzf "$package" | grep -Fx './data.tar.gz'
            tar -xOzf "$package" ./debian-binary | grep -Fx '2.0'
            tar -xOzf "$package" ./control.tar.gz | tar -tzf - | grep -F './control'
          done
          tar -xOzf "$base" ./data.tar.gz | tar -tzf - | grep -F './usr/bin/frnt-openwrt-client'
          tar -xOzf "$luci" ./data.tar.gz | tar -tzf - | grep -F './www/luci-static/resources/view/frnt/client.js'
          sha256sum "$base" "$luci" > SHA256SUMS.txt
          ls -lh "$base" "$luci" SHA256SUMS.txt

      - name: Upload Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frnt-openwrt-client-v0.1.2
          path: |
            openwrt-client/dist/*.ipk
            openwrt-client/dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish public OpenWrt release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: openwrt-client-v0.1.2
          target_commitish: ${{ github.sha }}
          name: FRNT OpenWrt Client v0.1.2 + LuCI
          make_latest: false
          generate_release_notes: false
          body: |
            Updated GL-AXT1800 / OpenWrt 23.05 FRNT discovery client.

            - **Fixed OpenWrt .ipk archive format** (previous v0.1.1 used Debian-style ar packaging)
            - **frnt-openwrt-client...ipk**: headless client + procd service
            - **luci-app-frnt-client...ipk**: optional LuCI Services → FRNT Discovery Client controls
            - Includes NetBird interface check, configuration, Start/Stop/Restart, status, and FRNT logs.

            **Server diagnostics:** `connection refused` to the server's NetBird IP UDP 14992 means the server listener or firewall is rejecting the control traffic. Check that FRNT server mode is running and that `SEND_INTERFACE` is set to the NetBird interface.

            **Discovery-only:** SmartSDR control/TCP and VITA forwarding still require routing or proxy support.

            See `openwrt-client/README.md` for installation and troubleshooting.
          files: |
            openwrt-client/dist/*.ipk
            openwrt-client/dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
